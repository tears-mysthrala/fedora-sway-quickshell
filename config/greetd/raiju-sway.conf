font pango:Cascadia Mono NF 11

output * bg /usr/share/backgrounds/raiju/raiju_guardian_under_crimson_lightning.png fill
xwayland disable

input type:keyboard {
    xkb_layout es
}

bindsym Mod4+Shift+e exec swaynag -t warning -m 'Sesión del sistema' -b 'Apagar' 'systemctl poweroff' -b 'Reiniciar' 'systemctl reboot'

exec swayidle -w timeout 300 'swaymsg "output * power off"' resume 'swaymsg "output * power on"'
exec "gtkgreet --layer-shell --style /etc/greetd/raiju.css; wayland-logout"
